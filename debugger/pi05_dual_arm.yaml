dataset:
  repo_id: ela3_dual_demo
  root: ./lerobot_data/ela3_dual_demo
  eval_split: 0.1
  image_transforms:
    enable: true
    random_order: true

eval_steps: 500
policy:
  type: pi05_torque
  robot_mode: dual
  # Intentionally no pretrained_path: do not treat an existing single-arm 7D
  # PI0.5 checkpoint (and its processor) as a dual-arm checkpoint.
  torque_key: observation.gripper_torque
  chunk_size: 50
  n_action_steps: 20
  max_state_dim: 32       # processor normalizes and merges 14+2 -> 16D
  max_action_dim: 32      # checkpoint output feature remains exactly 14D
  device: cuda
  push_to_hub: false
  dtype: bfloat16
  freeze_vision_encoder: true
  train_expert_only: true

save_checkpoint: true
output_dir: ./ckpt/pi05_ela3_dual
batch_size: 4
job_name: pi05_ela3_dual
resume: false
seed: 42
num_workers: 4
steps: 40000
env_eval_freq: -1
log_freq: 50
save_freq: 2000
use_policy_training_preset: true

wandb:
  enable: false
  project: pi05_ela3_dual
  entity: <your_wandb_entity>
