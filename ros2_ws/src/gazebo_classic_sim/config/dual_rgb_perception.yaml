perception_node:
  ros__parameters:
    use_sim_time: true
    rgb_topic: /camera_main/image_raw
    camera_info_topic: /camera_main/camera_info
    base_frame: base_link
    publish_rate_hz: 5.0
    min_cube_area_px: 120.0
    # A 10 cm zone at the far side of the compact tray projects to roughly
    # 500--900 px², while the 4.5 cm cubes remain below this threshold.
    min_zone_area_px: 250.0
    morphology_kernel_size: 5
    # camera_main calibrated from the current four world markers and its
    # CameraInfo intrinsics, expressed in base_link after yaw=pi robot spawn.
    # Keeping the external pose here lets every HSV detection use its current
    # image pixel rather than a location-specific object pose.
    camera_translation_base_m: [-1.090682, 0.742378, 0.458404]
    camera_rotation_rpy: [-2.056125, 0.016431, -2.589172]
    # The contour centroids represent the centres of the cube/marker visual
    # bodies (not their top faces).  Intersect the calibrated camera ray with
    # those actual centre planes, so the published XY is the object centre
    # used by the grasp geometry.
    table_plane_z_m: 0.0915
    cube_top_plane_z_m: 0.1115
    target_zone_plane_z_m: 0.0995
    # Ray projection of the obliquely visible 40 mm cube top is consistently
    # +5.5 mm in base X and -4.5 mm in base Y from Gazebo's physical centre.
    # Correct that measured image-centroid bias before task geometry uses the
    # live visual coordinate; target markers are flat and require no offset.
    cube_xy_calibration_offset_m: [-0.0055, 0.0045]
    # A non-nine-element list explicitly disables the optional homography
    # while keeping this ROS 2 parameter initialized.
    image_to_base_homography: [0.0]
