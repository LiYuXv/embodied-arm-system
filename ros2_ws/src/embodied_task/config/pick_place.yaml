# Visual XY is mandatory in normal operation.  These are shared physical
# dimensions, not per-colour fixed grasp poses.  The low thin tray's actual
# The operation deck is raised just enough that the existing jaw-pad midpoint
# meets the cube centre without the lower pad edge touching the deck.
table_plane_z_m: 0.0915
cube_support_plane_z_m: 0.0915
cube_height_m: 0.040
# The adapter uses 38 mm high physical side pads.  Align their centre with the
# live cube centre: their lower edge stays 1 mm above the deck and they touch
# opposing cube faces rather than the top edge.
grasp_band_height_offset_m: 0.0
# The camera is millimetre-accurate but the physical jaw collision band has a
# narrow contact window.  These are relative visual XY candidates, tried only
# after a failed real-contact close; no fixed world/object pose is used.
## Physical Gazebo feedback for the edge-aligned wrist shows a repeatable
## +8 mm TCP X bias during the final force-servo descent.  Apply its inverse
## to the *fresh visual object centre* first, then retain symmetric local
## retries; this is not a fixed world pickup coordinate.
grasp_contact_offsets_m: [[0.0, 0.0], [0.003, 0.003], [-0.003, 0.0],
                           [-0.003, -0.003],
                           [0.006, 0.006], [-0.006, -0.006],
                           [0.003, -0.003], [-0.003, 0.003],
                           [0.006, -0.006], [-0.006, 0.006],
                           [0.010, 0.010], [-0.010, -0.010],
                           [0.010, -0.010], [-0.010, 0.010]]
# Ten millimetres above the side-pad grasp band clears the cube before the
# final descent while remaining in the verified A3 TCP corridor.
approach_height_m: 0.010
approach_vector_m: [0.0, 0.0, 0.010]
# After the short break-away lift, travel to a genuinely elevated placement
# waypoint.  This keeps the flat cube clear of the workbench before the final
# straight descent instead of sweeping it sideways at contact height.
placement_approach_height_m: 0.100
# Release a few millimetres above the target centre so the cube drops onto the
# marker instead of relying on a side collision to spring back into place.
placement_drop_height_m: 0.010
# The A3 reaches the compact tray through a narrow wrist branch.  A 5 mm
# strictly vertical break-away clears the operation board without crossing its
# Cartesian singularity; the following collision-checked MoveIt transit then
# raises and carries the physically grasped cube to the target region.
lift_height_m: 0.005
retreat_height_m: 0.005
# Start with the gripper bar facing forward across the tray: +90 degrees about
# the end-effector's local Z axis.  Keeping this same L6-controlled roll from
# grasp through placement avoids twisting an already attached cube.  L6 is
# still not fixed as an individual joint; it compensates for the current L1.
orientation_xyzw: [0.0, 0.0, 0.7071068, 0.7071068]
orientation_by_object:
  red_cube: [0.0, 0.0, 0.7071068, 0.7071068]
  red_target_zone: [0.2705981, 0.2705981, 0.6532815, 0.6532815]
  blue_cube: [0.0, 0.0, 0.7071068, 0.7071068]
  blue_target_zone: [0.2705981, 0.2705981, 0.6532815, 0.6532815]
# Keep the established +45 degree L5-controlled tilt, then post-multiply a
# +90 degree rotation about the end-effector's own Z axis.  This changes only
# the L6-controlled jaw roll: the gripper bar faces forward across the tray
# instead of presenting its side, while L6 remains free to compensate for L1.
placement_orientation_xyzw: [0.2705981, 0.2705981, 0.6532815, 0.6532815]
# Gazebo's runtime fixed attachment preserves the real grasped offset, which
# is 50 mm shorter in base X and 8 mm higher in base Y than the idealised
# grasp_center projection after the +45 degree placement tilt.  Shift only the
# commanded placement centre so the released cube, not the TCP, lands on the
# unchanged visual target marker.
# The previous release was still a little too far forward along base_link X.
# Pull the commanded release point back by 10 mm while leaving the lateral
# correction and all grasp poses unchanged.
placement_region_correction_m: [-0.010, 0.012]
# The Classic adapter publishes grasp_center at the midpoint of the existing
# jaw collision pads.  This remains a fallback only if that adapter TF is not
# available; normal tasks read the same transform directly from TF.
jaw_center_offset_m: [0.0, 0.0003, -0.1171]

# Only used when task_manager is explicitly launched with
# allow_pose_fallback:=true.  It is intentionally not a normal task input.
debug_pose_fallbacks:
  red_cube: [-0.43, 0.18]
  blue_cube: [-0.43, -0.18]
  red_target_zone: [-0.38, 0.10]
  blue_target_zone: [-0.38, -0.10]
motion:
  # Transit stays in the verified raised corridor.  Contact descents are kept
  # slow so the physical jaw collision bodies do not impart an ODE impulse to
  # the cube; lift uses an intermediate value while carrying real contact.
  velocity_scale: 0.20
  acceleration_scale: 0.20
  # The Gazebo force servo needs a multi-second profile for the final 80 mm
  # descent.  Faster profiles reached the controller's joint tolerance while
  # the TF-measured TCP was still at the approach height.
  contact_velocity_scale: 0.02
  contact_acceleration_scale: 0.02
  # A true frictional grasp needs a slower physical lift than free-space
  # transit; motion_executor converts this scale into the Cartesian segment
  # duration rather than ignoring it.
  lift_velocity_scale: 0.01
  lift_acceleration_scale: 0.01
