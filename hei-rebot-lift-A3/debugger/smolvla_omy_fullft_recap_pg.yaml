# SmolVLA 全量微调配置（VLM + 视觉编码器 + 动作专家 + state 投影全训）
# 目标硬件：RTX 4080S 16GB（本机）；96GB 服务器同样可跑（可调大 batch_size）
#
# 与 smolvla_omy_fullft_recap.yaml 的唯一差异：
#   sample_weighting.type = recap_pg（R3 优势加权策略改进，PI06_RL_迁移实施方案.md §5 R3）
#   —— 以 critic ΔV ∪ 组优势 ∪ 人标 合并的逐帧优势，经 AWR/CRR/linear 算子映射权重，
#      替代 R2 的启发式权重（good×1 / bad×0.1 / 干预×2）。
#
# 前置数据准备（顺序，cd debugger）：
#   1. visualize_data 生成训练 sidecar（make_recap_sidecar.py）
#   2. python3 recap_group_advantage.py --dataset lerobot_data/ela3_demo5   # 组优势
#   3. python3 recap_critic.py --dataset lerobot_data/ela3_demo5 train --backend state --apply  # critic ΔV
#   4. python3 recap_pg.py --dataset lerobot_data/ela3_demo5 --operator awr --write  # pg_advantage 列
#   （步骤 2/3/4 可缺省——weighter 会按可用来源自动降级，见 recap_pg.py 文档）
dataset:
  repo_id: ela3_demo5
  root: ./lerobot_data/ela3_demo5
  eval_split: 0.1              # 留出 10% episodes 做验证 loss（监控过拟合）
  image_transforms:
    enable: true                # 图像增强（亮度/对比度等，见默认 tfs 配置）
    random_order: true         # 随机顺序应用增强
# 验证 loss 计算频率（步）：eval_split 只划分数据，eval_steps>0 才会真正计算
eval_steps: 500
policy:
  type: smolvla_torque
  torque_key: observation.gripper_torque
  # ===== 全参量微调（full fine-tuning）开关 =====
  # SmolVLA 默认是部分微调：冻结视觉编码器 + 只训动作专家（VLM 语言/视觉层冻结）。
  # 以下三项全部放开，VLM + 视觉编码器 + 动作专家 + state 投影全部参与训练：
  freeze_vision_encoder: false   # 是否冻结SigLIP 视觉编码器（默认 true 为冻结）
  train_expert_only: false       # 是否只训动作专家（默认 true）
  train_state_proj: true         # state/torque 投影层始终可训练（默认 true）
  # 从 SmolVLA 官方预训练权重微调（VLM+动作专家都有机器人数据先验，不从零训练）；
  # 权重已实测与 smolvla_torque 完全兼容（0 missing/unexpected）
  pretrained_path: ./pretrained_models/smolvla_base
  # 注意：不要设置 n_obs_steps——SmolVLA 的 observation_delta_indices 硬编码 [0]，
  # 该参数对 SmolVLA 无效（lerobot 0.4/0.6 均如此）
  chunk_size: 40
  n_action_steps: 20
  device: cuda
  push_to_hub: false
  vlm_model_name: ./pretrained_models/smolvlm2-500m-video-instruct

save_checkpoint: true
output_dir: ./ckpt/smolvla_ela3_demo5_recap_pg_fullft  # 与 recap(加权SFT)/普通SFT 目录隔离
# 全参量微调显存占用远高于默认的部分微调（VLM+视觉编码器梯度/优化器状态全部打开），
# batch_size 32 若 OOM，请降到 16 或 8（num_workers 可不变）。
batch_size: 8
job_name: smolvla_ela3_demo5_recap_pg_fullft
resume: false
seed: 42
num_workers: 4
steps: 20_000           # 对齐开源项目（27.7 epoch 量级），分阶段评估可提前停
env_eval_freq: -1
log_freq: 50
save_freq: 2_000
use_policy_training_preset: true

# ===== π*0.6 R3：优势加权的策略改进（offline RL）=====
# 权重由 recap_pg.py 生成的 pg_advantage（critic ΔV ∪ 组优势 ∪ 人标）经算子得出。
# 对照实验：type 改回 recap（R2 加权 SFT）或删除本段（普通 SFT）。
sample_weighting:
  type: recap_pg
  extra_params:
    operator: awr               # awr=exp(A/τ) | crr=1[A>0]?1:negative | linear=1+βA
    tau: 1.0                    # AWR 温度（τ↑ 更保守，τ↓ 更激进；τ→∞ 退化为均匀）
    beta: 1.0                   # linear 算子斜率
    negative: 0.1               # 负优势帧权重下限（降权非过滤，同 R2 bad×0.1）
    intervention: 2.0           # 干预帧乘子（RECAP 恒正）
    min_weight: 0.1
    max_weight: 5.0
    # advantage_conditioning（R1c P4）独立于本 weighter，如需同时开启见 recap yaml 说明

wandb:
  enable: false
  project: smolvla_ela3
  entity: <your_wandb_entity>
  disable_artifact: true
